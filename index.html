<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>mindscape</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>mindscape</h1>
    <p class="tagline">A simple HTML/CSS/JS site ready for GitHub Pages</p>

  <footer>
    <small>Hosted on GitHub Pages</small>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
