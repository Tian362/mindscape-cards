<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindscape Cards</title>
    <style>
        .cards {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            max-width: 200px;
        }
        .card img {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Welcome to Mindscape Cards</h1>
    <div class="cards">
        <div class="card">
            <img src="cards/card-1.jpg" alt="Card 1">
        </div>
        <div class="card">
            <img src="cards/card-2.jpg" alt="Card 2">
        </div>
    </div>
</body>
</html>
